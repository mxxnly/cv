name: 🧪 CI

on:
  pull_request:
  push:
    # main is covered by deploy.yml, which calls this workflow first.
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 🐍 Backend | Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Repo | Checkout
        uses: actions/checkout@v7

      - name: 🐍 Python | Set up 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 📦 Deps | Install
        run: pip install -r requirements-dev.txt

      - name: 🔎 Ruff | Lint
        run: ruff check . --output-format=github

      - name: ✨ Ruff | Format check
        run: ruff format --check .

      - name: 🗄️ Django | Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: 🧪 Pytest | Run tests
        run: pytest

  frontend:
    name: ⚛️ Frontend | Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Repo | Checkout
        uses: actions/checkout@v7

      - name: 🟢 Node | Set up 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Deps | Install
        run: npm ci --no-audit --no-fund

      - name: 🔎 ESLint | Lint
        run: npm run lint

      - name: 🧠 TypeScript | Type check
        run: npm run typecheck

      - name: 🧪 Vitest | Run tests
        run: npm test

      - name: 🏗️ Vite | Production build
        run: npm run build

  docker:
    name: 🐳 Docker | Build check (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Deploys build and push the images themselves; this only guards pull requests.
    if: github.event_name == 'pull_request'
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: docker/Dockerfile.backend
            target: production
          - component: frontend
            dockerfile: docker/Dockerfile.frontend
            target: production
          - component: nginx
            dockerfile: docker/Dockerfile.nginx
            target: ""

    steps:
      - name: 📥 Repo | Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Docker | Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🧱 Image | Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
