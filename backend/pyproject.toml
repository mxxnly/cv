[project]
name = "mxxnly-labs-backend"
version = "1.0.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Content and configuration data: long human-readable strings are clearer unwrapped.
"apps/*/management/commands/seed_demo.py" = ["E501"]
"apps/catalog/admin.py" = ["E501"]
"apps/catalog/models.py" = ["E501"]
"config/settings.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore:No directory at:UserWarning",
    "ignore::django.utils.deprecation.RemovedInDjango60Warning",
]
