<style>

</style></head><body><div class="w"><h1>MXXNLY Labs — раунд 2</h1>

<script>
[["01-prompt","Prompt","Термінал / dev-first. Темний, моно-шрифт, лайм-акцент. Продукти як `ls -l`.","#0A0F0B","#B6F24A","#DCE8DA","#1E2A21","#0A0F0B","dark"],
