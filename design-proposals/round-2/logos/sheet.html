<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MXXNLY Labs — 5 логотипів</title>
<style>
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#ddd;color:#111}
h1{margin:0;padding:24px 32px 0;font-size:22px}
.row{display:grid;grid-template-columns:1fr 1fr;margin:24px 32px;border-radius:14px;overflow:hidden}
.row h2{grid-column:1/-1;margin:0;padding:12px 20px;background:#111;color:#fff;font-size:15px;font-weight:600}
.cell{padding:36px 28px;display:flex;flex-direction:column;gap:28px;align-items:flex-start}
.light{background:#fff}.dark{background:#111}
.cell img.logo{height:56px;max-width:100%}
.mk{display:flex;gap:20px;align-items:center}
.mk img.m{height:56px}.mk img.f{height:64px;border-radius:6px}.mk img.s{height:16px}.mk img.s2{height:32px}
.note{grid-column:1/-1;background:#f4f4f4;padding:12px 20px;font-size:14px;color:#333}
@media(max-width:800px){.row{grid-template-columns:1fr;margin:16px}}
</style></head><body>
<h1>MXXNLY Labs — раунд 2: 5 логотипів</h1>
<script>
var L=[
["01-riso","Riso","Двокольоровий друк із зсувом фарб: два X накладаються (рожевий × кобальт), у місці перетину виходить третій колір."],
["02-draft","Draft","Креслення: коло з візирними лініями, XX у перехресті, розмірна лінія."],
["03-phase","Phase","Півмісяць із маленьким × замість зірки: продукти названі за місячними божествами."],
["04-klein","Klein","Ультрамарин: квадрат із жирним і тонким X. Лише одна фарба."],
["05-bitmap","Bitmap","1-бітний піксельний шрифт і знак XX на сітці 5×5."]];
L.forEach(function(l){var d=l[0],p="./"+d+"/";document.write(
'<div class="row"><h2>'+d+' · '+l[1]+'</h2>'+
['light','dark'].map(function(t){return '<div class="cell '+t+'"><img class="logo" src="'+p+'logo-on-'+t+'.svg" alt="">'+
'<div class="mk"><img class="m" src="'+p+'mark-on-'+t+'.svg" alt=""><img class="f" src="'+p+(t=='dark'?'favicon-dark':'favicon')+'.svg" alt=""><img class="s2" src="'+p+(t=='dark'?'favicon-dark':'favicon')+'.svg" alt=""><img class="s" src="'+p+(t=='dark'?'favicon-dark':'favicon')+'.svg" alt=""></div></div>'}).join('')+
'<div class="note">'+l[2]+'</div></div>')})
</script></body></html>
