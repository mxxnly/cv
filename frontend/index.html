<!doctype html>
<html lang="%SITE_LANG%" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%COMPANY_NAME%</title>
    <meta name="description" content="%COMPANY_DESCRIPTION%" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F7FB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15121F" />
    <meta property="og:site_name" content="%COMPANY_NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%COMPANY_NAME%: %COMPANY_TAGLINE%" />
    <meta property="og:description" content="%COMPANY_DESCRIPTION%" />
    <meta property="og:image" content="https://%SITE_DOMAIN%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      ;(function () {
        var root = document.documentElement
        var theme = 'light'
        try {
          var saved = localStorage.getItem('theme')
          theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (e) {}
        root.dataset.theme = theme
        root.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>%COMPANY_NAME%: %COMPANY_TAGLINE%. This site requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
