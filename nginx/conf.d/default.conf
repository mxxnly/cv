# Upstreams are resolved through Docker's DNS at request time (variables in proxy_pass), so a
# restarted backend/frontend container with a new IP never leaves nginx serving 502s.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade (Vite HMR in development).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind Traefik keep its X-Forwarded-Proto (https); otherwise use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 25m;

    # Django: API, admin, static (WhiteNoise) + uploaded media.
    include /etc/nginx/fragments/backend.conf;

    # React SPA (Vite dev server in development, static nginx in production).
    include /etc/nginx/fragments/frontend.conf;
}
